    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <a href="index.html">Belayneh <span>Endalamaw</span></a>
            </div>
            
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>

            </ul>

            <div class="nav-actions">
                <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="hamburger" id="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-container">
        <h2 class="section-title">Contact Me</h2>
        <div class="contact-container">
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="sender-name">Your Name</label>
                    <input type="text" id="sender-name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="sender-email">Your Email</label>
                    <input type="email" id="sender-email" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="sender-subject">Subject</label>
                    <input type="text" id="sender-subject" placeholder="Inquiry / Collaboration / Speaking" required>
                </div>
                <div class="form-group">
                    <label for="sender-message">Message</label>
                    <textarea id="sender-message" placeholder="Write your message here..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
                <div id="form-status" style="display: none; text-align: center; margin-top: 10px;"></div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Belayneh Endalamaw Dejene. All Rights Reserved. Built with modern web standards and deployed on GitHub Pages.</p>
